# Nginx для frontend (Лабораторная работа №8).
# Фронтенд — SPA: Nginx отдаёт статику, клиентский роутинг решает сам (fallback на index.html).
# API и WebSocket фронтенд запрашивает напрямую у backend (http://localhost:5000),
# т.к. пути роутера (/articles/:id) пересекаются с маршрутами API — проксировать их нельзя.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статика SPA + fallback для клиентского роутинга
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные ассеты из сборки Vite — кэшируются долго
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}