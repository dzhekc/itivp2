services:
  postgres-wiki:
    image: docker-proxy.artifactory.tcsbank.ru/postgres:15
    container_name: wiki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data-wiki:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-wiki:
    image: docker-proxy.artifactory.tcsbank.ru/mongo:7
    container_name: wiki_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-wiki}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-wiki}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-wiki_db}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data-wiki:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data-wiki:
  mongo_data-wiki:
